[build-system]
requires = ["flit_core >=3.4,<4"]
build-backend = "flit_core.buildapi"

[project]
name = "erpnext_chatgpt"
authors = [
    { name = "Custom AI Integration", email = "admin@example.com"}
]
description = "ChatGPT & AI Copilot Integration for ERPNext / Frappe v16"
